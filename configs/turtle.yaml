# 千年老龟 — 绝对避四防守型
personality: turtle
description: "极度恐惧吃四，宁可流局绝不放铳"

reward:
  fourth_place_penalty: -200.0
  dealing_in_penalty: -50.0

training:
  lr: 3.0e-4
  clip_epsilon: 0.2
  gamma: 0.99
  gae_lambda: 0.95
  entropy_coef: 0.02          # 较高熵鼓励探索防守策略
  value_loss_coef: 0.5
  max_grad_norm: 1.0
  num_envs: 64
  rollout_steps: 2048
  ppo_epochs: 10
  mini_batch_size: 1024
  use_amp: true
