# 千年老龟 — 强手进攻、弱手死守型
personality: turtle
description: "4翻以上积极和牌，弱手弃和死守避四"

reward:
  fourth_place_penalty: -200.0    # 四位惩罚
  dealing_in_penalty: -50.0       # 放铳惩罚
  high_value_bonus: 200.0         # 4翻以上和牌奖励
  high_value_threshold: 4         # 高打点门槛（番数）
  riichi_bonus: 100.0             # 立直中间奖励（增加信号密度）

rl_training:
  lr: 5.0e-5
  clip_epsilon: 0.1
  gamma: 0.99
  gae_lambda: 0.95
  entropy_coef: 0.01
  value_loss_coef: 0.5
  max_grad_norm: 1.0
  ppo_epochs: 4
  mini_batch_size: 1024
  kl_coef: 1.0                   # KL 正则化系数（强锚定 SL 预训练）
