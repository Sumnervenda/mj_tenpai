# 默认训练超参数配置（RTX 5060 Ti / 16GB VRAM）

model:
  spatial_channels: 10
  base_channels: 128
  num_res_blocks: 6
  metadata_dim: 14
  action_dim: 77

sl_training:
  epochs: 50
  batch_size: 2048
  num_workers: 12
  lr: 3.0e-4
  weight_decay: 1.0e-4
  lr_scheduler: cosine
  data_split: [0.8, 0.1, 0.1]
  save_every_epochs: 5
  use_amp: true

rl_training:
  total_steps: 1000000
  save_interval: 50000
  eval_interval: 100000
  clip_epsilon: 0.2
  gamma: 0.99
  gae_lambda: 0.95
  entropy_coef: 0.01
  value_loss_coef: 0.5
  max_grad_norm: 1.0
  num_envs: 64
  rollout_steps: 2048
  ppo_epochs: 10
  mini_batch_size: 1024
  lr: 1.0e-4
  use_amp: true

wandb:
  enabled: false
  project: mahjong-dl
  entity: null
