# 立直原教旨 — 浪漫门清型
personality: riichi_fundamentalist
description: "对副露产生厌恶，极其注重门清牌效，听牌必立直"

reward:
  chi_pon_penalty: -50.0
  riichi_bonus: 300.0

training:
  lr: 3.0e-4
  clip_epsilon: 0.2
  gamma: 0.99
  gae_lambda: 0.95
  entropy_coef: 0.01
  value_loss_coef: 0.5
  max_grad_norm: 1.0
  num_envs: 64
  rollout_steps: 2048
  ppo_epochs: 10
  mini_batch_size: 1024
  use_amp: true
